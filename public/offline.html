<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#58372b" />
    <title>Tidak Ada Koneksi - Gula Kabung</title>
    <style>
      * { box-sizing: border-box; }
      body {
        min-height: 100vh;
        margin: 0;
        padding: 24px;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #fdfcf9;
        color: #58372b;
        font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
        text-align: center;
      }
      main { width: 100%; max-width: 360px; }
      svg { width: 72px; height: 72px; margin-bottom: 24px; }
      h1 { margin: 0 0 12px; font-size: 24px; }
      p { margin: 0 0 24px; line-height: 1.6; color: #7a5f55; }
      button {
        width: 100%;
        min-height: 48px;
        border: 0;
        border-radius: 12px;
        background: #58372b;
        color: #fff;
        font: inherit;
        font-weight: 700;
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <main>
      <svg viewBox="0 0 100 100" aria-hidden="true">
        <rect width="100" height="100" rx="30" fill="#58372b" />
        <path d="M50 25C50 25 25 35 25 60C25 75 40 80 50 80C60 80 75 75 75 60C75 35 50 25 50 25Z" fill="none" stroke="#d4af37" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" />
        <path d="M50 35C45 50 45 65 50 75" fill="none" stroke="#d4af37" stroke-width="4" stroke-linecap="round" />
      </svg>
      <h1>Tidak ada koneksi</h1>
      <p>Periksa internet Anda, lalu coba lagi. Stok, pesanan, dan laporan perlu koneksi agar datanya selalu benar.</p>
      <button type="button" onclick="location.reload()">Coba Lagi</button>
    </main>
  </body>
</html>
